name: Android build

on:
  push:
    branches: ["main", "feature/integrate-sunmobile-ai-agent-sdk"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application and pinned SDK submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate Android SDK Manager and accept licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
      - name: Install Android API 37.0
        run: sdkmanager --install "platforms;android-37.0"
      - name: Provide non-production Firebase config for compile-only CI
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "suncommerz-ci-placeholder",
              "storage_bucket": "suncommerz-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:0000000000000000",
                "android_client_info": { "package_name": "com.suncommerz.associate" }
              },
              "api_key": [{ "current_key": "ci-placeholder-not-a-real-key" }],
              "services": {}
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
